project: "{{PROJECT_NAME}}"
type: web            # web | mobile | claude-plugin | chrome-ext
dry_run: true        # agents log what they would do, but change nothing
product_lead: true   # decides non-critical spec questions; false sends every question to you
control_issue: 0     # number of the "SDLC control" issue (add the PAUSE label there to stop everything); /sdlc-init sets it
timezone: Europe/Copenhagen
night_window: { enabled: true, start: "01:00", end: "06:00" }  # enabled: false lets the picker run at any hour
limits:
  active_items: 1
  daily_runs: 20     # agent runs per day, counted from the run ledger
  retries: 2
needs:
  enabled: true      # decides stack and docs/design.md after the first spec; false skips it
gates:
  protected_paths:
    - ".github/**"
    - ".sdlc/**"
    - "docs/constitution.md"
    - "**/migrations/**"
    - "package.json"
    - "package-lock.json"
auto_merge:
  enabled: false     # stays off until the trust ladder allows it
notify:
  url: ""            # URL of your notification service (services/notify); empty turns notifying off. The key is the SDLC_NOTIFY_KEY secret
deploy:
  provider: cloudflare-pages  # cloudflare-pages: sdlc-ci deploys after checks pass on main | none
  project: ""        # cloudflare-pages project name
  dir: dist          # build output that cloudflare-pages uploads
  health_url: ""     # live URL; empty turns the health monitor off
branches:
  pattern: "<kind>/<area>/<issue>-<slug>"
  kinds: [fix, update, chore]
  areas: [ux, technical, docs, test]
