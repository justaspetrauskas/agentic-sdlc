project: "{{PROJECT_NAME}}"
type: web            # web | mobile | claude-plugin | chrome-ext
dry_run: true        # agents log what they would do, but change nothing
product_lead: true   # decides non-critical spec questions; false sends every question to you
timezone: Europe/Copenhagen
night_window: { start: "01:00", end: "06:00" }
limits:
  active_items: 1
  daily_runs: 6
  retries: 2
gates:
  protected_paths:
    - ".github/**"
    - ".sdlc/**"
    - "docs/constitution.md"
    - "**/migrations/**"
    - "package.json"
    - "package-lock.json"
auto_merge:
  enabled: false     # stays off until the trust ladder allows it
notify:
  url: ""            # optional notification service
deploy:
  provider: railway  # railway: Railway deploys itself after CI (Wait for CI) | cloudflare-pages: sdlc-ci deploys after checks | none
  project: ""        # cloudflare-pages project name
  dir: dist          # build output that cloudflare-pages uploads
  health_url: ""     # live URL; empty turns the health monitor off
branches:
  pattern: "<kind>/<area>/<issue>-<slug>"
  kinds: [fix, update, chore]
  areas: [ux, technical, docs, test]
