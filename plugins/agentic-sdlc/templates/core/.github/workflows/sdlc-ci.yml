name: sdlc-ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Deploys run from here, after checks pass on main.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    # The deterministic gate: typecheck, lint and tests decide whether a change can merge.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Skip before the scaffold
        id: pkg
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No package.json yet, nothing to check." >> "$GITHUB_STEP_SUMMARY"; fi

      - if: steps.pkg.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - if: steps.pkg.outputs.present == 'true'
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Required scripts exist
        if: steps.pkg.outputs.present == 'true'
        run: |
          for s in typecheck lint test; do
            jq -e --arg s "$s" '.scripts[$s]' package.json >/dev/null || { echo "::error::package.json has no \"$s\" script"; exit 1; }
          done

      - if: steps.pkg.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.pkg.outputs.present == 'true'
        run: npm run lint
      - if: steps.pkg.outputs.present == 'true'
        run: npm test

  secrets:
    # Scans the commits of a PR (or the whole history on main) for committed secrets. A hit blocks the merge.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          v=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          if [ -n "$RANGE" ]; then "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts "$RANGE" .
          else "$RUNNER_TEMP/gitleaks" git --no-banner --redact .; fi

  deploy:
    # Only after checks pass on main, so a red build never deploys.
    needs: [checks, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          provider=$(yq '.deploy.provider // "none"' .sdlc/config.yml)
          if [ "$provider" != "cloudflare-pages" ]; then echo "Provider is $provider. Nothing to deploy."; exit 0; fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing, so nothing was deployed."; exit 0
          fi
          if [ ! -f package.json ]; then echo "No package.json yet. Nothing to deploy."; exit 0; fi
          echo "project=$(yq '.deploy.project // ""' .sdlc/config.yml)" >> "$GITHUB_OUTPUT"
          echo "dir=$(yq '.deploy.dir // "dist"' .sdlc/config.yml)" >> "$GITHUB_OUTPUT"

      - if: steps.cfg.outputs.project != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build and deploy to Cloudflare Pages
        if: steps.cfg.outputs.project != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.cfg.outputs.project }}
          DIR: ${{ steps.cfg.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main 2>/dev/null || echo "Project exists."
          npx --yes wrangler@4 pages deploy "$DIR" --project-name "$PROJECT" --branch main --commit-dirty=true | tee -a "$GITHUB_STEP_SUMMARY"

  scope:
    # Tripwire: a task PR that grew past its task stops and goes to the owner.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          task=$(printf '%s' "$PR_BODY" | sed -nE 's/^Closes #([0-9]+).*/\1/p' | head -n1)
          if [ -z "$task" ] || ! gh issue view "$task" --json labels --jq '.labels[].name' | grep -qxE 'type:(task|fix|ux)'; then
            echo "Not a task PR. Nothing to check."; exit 0
          fi
          gh issue view "$task" --json body --jq .body > "$RUNNER_TEMP/task.md"
          plan=$(sed -nE '1s/.*from `([^`]+)`.*/\1/p' "$RUNNER_TEMP/task.md")
          echo "number=$task" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

      - name: Tripwire
        if: steps.task.outputs.number != ''
        env:
          SDLC_NOTIFY_KEY: ${{ secrets.SDLC_NOTIFY_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TASK: ${{ steps.task.outputs.number }}
          PLAN: ${{ steps.task.outputs.plan }}
          PR: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # Script, config and plan come from the base branch, so a PR cannot edit its own tripwire.
          git show "$BASE:.sdlc/scripts/tripwire.py" > "$RUNNER_TEMP/tripwire.py"
          # A fix or UX issue with no plan has no plan file: nothing planned, so no new dependency is allowed.
          if [ -n "$PLAN" ]; then git show "$BASE:$PLAN" > "$RUNNER_TEMP/plan.md"; else : > "$RUNNER_TEMP/plan.md"; fi
          protected=$(git show "$BASE:.sdlc/config.yml" | yq -o=json -I=0 '.gates.protected_paths')
          if ! python3 "$RUNNER_TEMP/tripwire.py" "$BASE" "$RUNNER_TEMP/task.md" "$RUNNER_TEMP/plan.md" "$protected" > "$RUNNER_TEMP/trip.txt"; then
            body=$(printf 'Tripwire: this PR grew past task #%s, so it waits for you.\n\n%s\n\nMerge it yourself if that is fine, or close it and update the plan.' "$TASK" "$(sed 's/^/- /' "$RUNNER_TEMP/trip.txt")")
            gh pr comment "$PR" --body "$body"
            gh issue edit "$TASK" --add-label needs-you
            # The PR cannot choose the notify script or config that sees the key: both come from the base branch.
            mkdir -p "$RUNNER_TEMP/n/scripts"
            git show "$BASE:.sdlc/scripts/notify.py" > "$RUNNER_TEMP/n/scripts/notify.py"
            git show "$BASE:.sdlc/config.yml" > "$RUNNER_TEMP/n/config.yml"
            python3 "$RUNNER_TEMP/n/scripts/notify.py" needs-you "Tripwire: PR ${{ github.event.pull_request.number }} grew past task #$TASK" "${{ github.event.pull_request.html_url }}" "tripwire-${{ github.event.pull_request.number }}"
            cat "$RUNNER_TEMP/trip.txt"; exit 1
          fi
