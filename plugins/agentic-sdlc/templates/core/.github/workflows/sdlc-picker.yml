name: sdlc-picker
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write
concurrency:
  group: sdlc-picker
  cancel-in-progress: false
jobs:
  pick:
    # A plain script, not an agent. After each merge it starts the next task of the highest-priority planned item.
    # Spec and plan stay started by you, as your approval gates.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - id: guard
        uses: ./.github/actions/sdlc-guard
        with:
          agent: true

      - if: steps.guard.outputs.paused == 'true'
        run: echo "Pipeline is paused. Nothing to do."

      - if: steps.guard.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ steps.guard.outputs.dry_run == 'true' && '--dry-run' || '' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # The window applies to scheduled and push runs; a run you start by hand ignores it, and so do critical items.
          window=""
          if [ "$MANUAL" != true ] && [ "$(yq '.night_window.enabled // true' .sdlc/config.yml)" = true ]; then
            window="--window $(yq '.night_window.start' .sdlc/config.yml)-$(yq '.night_window.end' .sdlc/config.yml) --tz $(yq '.timezone // "UTC"' .sdlc/config.yml)"
          fi
          python3 .sdlc/scripts/picker.py $DRY $window | tee -a "$GITHUB_STEP_SUMMARY"
