name: sdlc-build
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: "Task issue number (build it)"
        required: false
      pr:
        description: "PR number (revise it; sdlc-ci-fix sends this when CI is red)"
        required: false
      request:
        description: "What to change, with pr"
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write
jobs:
  build:
    # You start a task by adding state:building to it. The picker will use workflow_dispatch later.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.task != '') ||
      (github.event.label.name == 'state:building' && github.event.sender.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'type:task'))
    concurrency:
      group: sdlc-issue-${{ github.event.issue.number || inputs.task }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - id: guard
        uses: ./.github/actions/sdlc-guard
        with:
          agent: true

      - if: steps.guard.outputs.paused == 'true'
        run: echo "Pipeline is paused. Nothing to do."

      - id: task
        if: steps.guard.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TASK: ${{ github.event.issue.number || inputs.task }}
        run: |
          title=$(gh issue view "$TASK" --json title --jq .title)
          body=$(gh issue view "$TASK" --json body --jq .body)
          parent=$(echo "$body" | sed -nE 's/.*Parent: #([0-9]+).*/\1/p' | head -n1)
          # A fix or UX issue with no plan is its own task.
          [ -n "$parent" ] || parent=$TASK
          kind=update
          if gh issue view "$parent" --json labels --jq '.labels[].name' | grep -qx type:fix; then kind=fix; fi
          slug=$(echo "$title" | sed -E 's/^Task [0-9]+ of [0-9]+: //; s/ \(#[0-9]+\)$//' \
            | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g' | cut -c1-40 | sed -E 's/-$//')
          echo "number=$TASK" >> "$GITHUB_OUTPUT"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          echo "branch=$kind/technical/$TASK-$slug" >> "$GITHUB_OUTPUT"
          gh issue edit "$TASK" --add-label state:building

      - name: Build (dry run)
        if: steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The picker dispatches builds with GITHUB_TOKEN, so the run is started by this bot.
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Follow .sdlc/prompts/build.md.
            Task issue: ${{ steps.task.outputs.number }}
            Mode: dry-run.
          claude_args: >-
            --model sonnet
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(mkdir:*),Bash(git status:*),Bash(git diff:*),Bash(gh issue view:*)"

      - name: Show dry-run diff
        if: steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run == 'true'
        run: |
          git add -A -N .
          { echo "## Build (dry run)"; echo '```'; git diff --stat; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (live)
        if: steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The picker dispatches builds with GITHUB_TOKEN, so the run is started by this bot.
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Follow .sdlc/prompts/build.md.
            Task issue: ${{ steps.task.outputs.number }}
            Parent issue: ${{ steps.task.outputs.parent }}
            Branch: ${{ steps.task.outputs.branch }}
            Mode: live.
          claude_args: >-
            --model sonnet
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(mkdir:*),Bash(git status:*),Bash(git diff:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr create:*)"

      - name: Record run
        id: record
        if: always() && steps.guard.outputs.paused != 'true' && steps.task.outputs.number != ''
        uses: ./.github/actions/sdlc-record
        with:
          notify_key: ${{ secrets.SDLC_NOTIFY_KEY }}
          stage: build
          issue: ${{ steps.task.outputs.number }}
          model: sonnet

      - name: Hand over
        if: always() && steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true' && steps.task.outputs.number != ''
        env:
          SDLC_NOTIFY_KEY: ${{ secrets.SDLC_NOTIFY_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TASK: ${{ steps.task.outputs.number }}
          BRANCH: ${{ steps.task.outputs.branch }}
          OUTCOME: ${{ steps.record.outputs.outcome }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          gh issue edit "$TASK" --remove-label state:building || true
          if [ -n "$pr" ]; then
            gh issue edit "$TASK" --add-label state:in-review
          elif [ "$OUTCOME" = rate_limited ]; then
            gh issue edit "$TASK" --add-label needs-you
            gh issue comment "$TASK" --body "The build hit a rate limit. The pipeline is paused; remove PAUSE and re-add state:building to try again."
            python3 .sdlc/scripts/notify.py needs-you "Build hit a rate limit: task #$TASK" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "build-$TASK-$GITHUB_RUN_ID"
          else
            # The run just recorded counts as attempt 1, so up to `retries` more attempts follow.
            # No record means no count to stop a loop, so that case is blocked, never retried.
            attempts=$(python3 .sdlc/scripts/ledger.py count --issue "$TASK" --stage build)
            if [ -n "$OUTCOME" ] && [ "$attempts" -le "$(yq '.limits.retries // 2' .sdlc/config.yml)" ]; then
              gh issue comment "$TASK" --body "The build run ended without a PR (attempt $attempts). Trying again."
              gh workflow run sdlc-build.yml -f task="$TASK"
            else
              gh issue edit "$TASK" --add-label state:blocked --add-label needs-you
              gh issue comment "$TASK" --body "The build ended without a PR after $attempts attempts, so it is blocked. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              python3 .sdlc/scripts/notify.py needs-you "Build blocked after $attempts attempts: task #$TASK" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "blocked-$TASK"
            fi
          fi

      - name: Usage report
        if: always() && steps.guard.outputs.paused != 'true'
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$f" ]; then
            echo "## Usage" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | select(.type=="result") | "- cost (API-equivalent): $\(.total_cost_usd)\n- turns: \(.num_turns)\n- output tokens: \(.usage.output_tokens)\n- cache read tokens: \(.usage.cache_read_input_tokens)"' "$f" >> "$GITHUB_STEP_SUMMARY" || true
          fi

  revise:
    # You comment "/build <what to change>" on a task PR; the builder changes that PR's branch.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr != '') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/build'))
    concurrency:
      group: sdlc-pr-${{ github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/sdlc-guard
        with:
          agent: true

      - if: steps.guard.outputs.paused == 'true'
        run: echo "Pipeline is paused. Nothing to do."

      - id: pr
        if: steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || inputs.pr }}
          REQUEST: ${{ inputs.request || github.event.comment.body }}
        run: |
          branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          case "$branch" in fix/*|update/*) ;; *) echo "Not a task PR."; exit 0;; esac
          git checkout "$branch"
          printf '%s\n' "${REQUEST#/build}" > "$RUNNER_TEMP/request.md"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          gh pr view "$PR" --json body --jq .body | sed -nE 's/^Closes #([0-9]+).*/task=\1/p' | head -n1 >> "$GITHUB_OUTPUT"

      - name: Revise
        if: steps.pr.outputs.branch != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # sdlc-ci-fix dispatches this job with GITHUB_TOKEN, so the run is started by this bot.
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Follow .sdlc/prompts/build.md.
            PR: ${{ steps.pr.outputs.number }}
            Branch: ${{ steps.pr.outputs.branch }} (already checked out)
            Owner's request: in ${{ runner.temp }}/request.md
            Mode: revise.
          claude_args: >-
            --model sonnet
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(mkdir:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh run view:*)"

      - name: Record run
        if: always() && steps.pr.outputs.branch != ''
        uses: ./.github/actions/sdlc-record
        with:
          notify_key: ${{ secrets.SDLC_NOTIFY_KEY }}
          stage: revise
          issue: ${{ steps.pr.outputs.task || steps.pr.outputs.number }}
          model: sonnet

      - name: Usage report
        if: always() && steps.pr.outputs.branch != ''
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$f" ]; then
            echo "## Usage" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | select(.type=="result") | "- cost (API-equivalent): $\(.total_cost_usd)\n- turns: \(.num_turns)\n- output tokens: \(.usage.output_tokens)\n- cache read tokens: \(.usage.cache_read_input_tokens)"' "$f" >> "$GITHUB_STEP_SUMMARY" || true
          fi
