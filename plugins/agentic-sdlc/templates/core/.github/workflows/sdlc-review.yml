name: sdlc-review
on:
  workflow_run:
    workflows: [sdlc-ci]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    # Advisory second opinion on task PRs (branches fix/... and update/...), after CI passes.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      (startsWith(github.event.workflow_run.head_branch, 'fix/') || startsWith(github.event.workflow_run.head_branch, 'update/'))
    concurrency:
      group: sdlc-review-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The base branch is checked out, so the PR cannot change the reviewer's own prompt or guard.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - run: git fetch origin "${{ github.event.workflow_run.head_sha }}"

      - id: guard
        uses: ./.github/actions/sdlc-guard

      - if: steps.guard.outputs.paused == 'true'
        run: echo "Pipeline is paused. Nothing to do."

      - id: pr
        if: steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh pr list --head "$BRANCH" --state open --json number,baseRefName \
            --jq '.[0] | "number=\(.number)\nbase=\(.baseRefName)"' >> "$GITHUB_OUTPUT"

      - name: Review
        if: steps.pr.outputs.number != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Task PRs are opened by the Claude app, so the CI run that triggers this review is started by it.
          allowed_bots: "claude,claude[bot]"
          prompt: |
            Follow .sdlc/prompts/review.md.
            PR: ${{ steps.pr.outputs.number }}
            Base branch: ${{ steps.pr.outputs.base }}
            Head commit: ${{ github.event.workflow_run.head_sha }}
          claude_args: >-
            --model opus
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"

      - name: Usage report
        if: always() && steps.pr.outputs.number != ''
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$f" ]; then
            echo "## Usage" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | select(.type=="result") | "- cost (API-equivalent): $\(.total_cost_usd)\n- turns: \(.num_turns)\n- output tokens: \(.usage.output_tokens)\n- cache read tokens: \(.usage.cache_read_input_tokens)"' "$f" >> "$GITHUB_STEP_SUMMARY" || true
          fi
