name: sdlc-spec-answer
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
jobs:
  answer:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'state:specifying')
    # Job-level, so events whose job is skipped never take the queue slot. GitHub keeps one pending run
    # per group; a newer one replaces it. Per issue that is harmless: a repeat label is a duplicate, and
    # update mode reads every owner comment since the last pipeline comment.
    # ponytail: different issues can run in parallel; the picker will enforce one active item per repo.
    concurrency:
      group: sdlc-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find the spec branch
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          branch=$(gh pr list --state open --json headRefName \
            --jq ".[] | select(.headRefName | startswith(\"chore/docs/${ISSUE}-spec-\")) | .headRefName" | head -n1)
          if [ -z "$branch" ]; then echo "No open spec PR for #$ISSUE."; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - if: steps.find.outputs.branch != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.find.outputs.branch }}

      - id: guard
        if: steps.find.outputs.branch != ''
        uses: ./.github/actions/sdlc-guard
        with:
          agent: true

      - if: steps.find.outputs.branch != '' && steps.guard.outputs.paused == 'true'
        run: echo "Pipeline is paused. Nothing to do."

      - name: Apply answers
        if: steps.find.outputs.branch != '' && steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow .sdlc/prompts/spec.md.
            Issue number: ${{ github.event.issue.number }}
            Spec branch: ${{ steps.find.outputs.branch }} (already checked out).
            Mode: update.
            Product lead: ${{ steps.guard.outputs.product_lead }}
          claude_args: >-
            --model opus
            --max-turns 25
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"

      - name: Keep writer usage
        if: always() && steps.find.outputs.branch != '' && steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true'
        run: mv "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/writer-usage.json" 2>/dev/null || true

      - name: Record writer
        if: always() && steps.find.outputs.branch != '' && steps.guard.outputs.paused != 'true'
        uses: ./.github/actions/sdlc-record
        with:
          stage: spec
          issue: ${{ github.event.issue.number }}
          model: opus
          file: ${{ runner.temp }}/writer-usage.json

      - name: Product lead
        if: steps.find.outputs.branch != '' && steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true' && steps.guard.outputs.product_lead != 'false'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow .sdlc/prompts/product-lead.md.
            Issue number: ${{ github.event.issue.number }}
            Spec branch: ${{ steps.find.outputs.branch }} (already checked out).
          claude_args: >-
            --model opus
            --max-turns 25
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"

      - name: Keep product-lead usage
        if: always() && steps.find.outputs.branch != '' && steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true'
        run: mv "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/product-lead-usage.json" 2>/dev/null || true

      - name: Record product-lead
        if: always() && steps.find.outputs.branch != '' && steps.guard.outputs.paused != 'true'
        uses: ./.github/actions/sdlc-record
        with:
          stage: product-lead
          issue: ${{ github.event.issue.number }}
          model: opus
          file: ${{ runner.temp }}/product-lead-usage.json

      - name: Usage report
        if: always() && steps.find.outputs.branch != ''
        run: |
          for step in writer product-lead; do
            f="$RUNNER_TEMP/$step-usage.json"
            [ -f "$f" ] || continue
            echo "## Usage: $step" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | select(.type=="result") | "- cost (API-equivalent): $\(.total_cost_usd)\n- turns: \(.num_turns)\n- output tokens: \(.usage.output_tokens)\n- cache read tokens: \(.usage.cache_read_input_tokens)"' "$f" >> "$GITHUB_STEP_SUMMARY" || true
          done
