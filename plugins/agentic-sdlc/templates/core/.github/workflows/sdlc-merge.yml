name: sdlc-merge
on:
  # The reviewer's "Review: ..." comment is the last step on a task PR, and its event carries the PR number.
  # (A workflow_run of sdlc-review would not: the review runs on the base branch.)
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  merge:
    # A plain script, not an agent. Merges a task PR only when every auto-merge rule holds; otherwise says why once.
    if: >-
      github.event.issue.pull_request && github.event.comment.user.login == 'claude[bot]' &&
      startsWith(github.event.comment.body, 'Review:')
    concurrency:
      group: sdlc-merge-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Base branch, so the PR cannot change the rules that judge it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - id: guard
        uses: ./.github/actions/sdlc-guard

      - id: decide
        if: steps.guard.outputs.paused != 'true' && steps.guard.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          read -r state branch sha < <(gh pr view "$PR" --json state,headRefName,headRefOid --jq '"\(.state) \(.headRefName) \(.headRefOid)"')
          [ "$state" = OPEN ] || { echo "PR #$PR is $state."; exit 0; }
          case "$branch" in fix/*|update/*) ;; *) echo "Not a task PR."; exit 0;; esac
          pr=$PR
          enabled=$(yq '.auto_merge.enabled // false' .sdlc/config.yml)
          protected=$(yq -o=json -I=0 '.gates.protected_paths' .sdlc/config.yml)
          python3 .sdlc/scripts/merge.py "$pr" "$sha" "$enabled" "$protected" > "$RUNNER_TEMP/decision.txt"
          cat "$RUNNER_TEMP/decision.txt"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "merge=$([ "$(cat "$RUNNER_TEMP/decision.txt")" = merge ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Say why it waits
        if: steps.decide.outputs.merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.decide.outputs.pr }}
        run: |
          body=$(printf '<!-- sdlc:merge -->\nWaits for you to merge:\n%s' "$(sed 's/^/- /' "$RUNNER_TEMP/decision.txt")")
          last=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | startswith("<!-- sdlc:merge -->"))][-1].body // ""')
          [ "$last" = "$body" ] || gh pr comment "$PR" --body "$body"

      # The app token makes the merge push trigger CI, deploy, picker and watchdog. GITHUB_TOKEN would not.
      - id: app
        if: steps.decide.outputs.merge == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.decide.outputs.pr }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          gh pr edit "$PR" --add-label auto-merged
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"
